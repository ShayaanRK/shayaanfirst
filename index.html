<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mini Projects</title>
  <style>
    /* CSS portion */
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #222;
    }
    .projects {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .project {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 250px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    .project:hover {
      transform: scale(1.05);
    }
    a {
      text-decoration: none;
      color: #0073e6;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Shayaan's Mini-Projects</h1>
  <p>Click on a project to view the live demo</p>

  <div class="projects">
    <div class="project">
      <h3>Simon Game</h3>
      <a href="https://ShayaanRK.github.io/shayaanfirst/Simon_Game/" target="_blank">Simon Game</a>
    </div>

    <div class="project">
      <h3>Online Drum Kit Player</h3>
      <a href="https://ShayaanRK.github.io/shayaanfirst/Simon_Game/Drum_Kit" target="_blank">Online Drum Kit</a>
    </div>

    <div class="project">
      <h3>Twitter Tweet Limit Counter</h3>
      <a href="https://ShayaanRK.github.io/shayaanfirst/Simon_Game/Twitter_Counter_Project/" target="_blank">Tweet Limit Counter</a>
    </div>
  </div>

</body>
</html>
